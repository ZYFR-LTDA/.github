<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="ZYFR — Engenharia, segurança e inteligência artificial para quem não pode errar.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1714"/>
      <stop offset="1" stop-color="#2a2622"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9c7209"/>
      <stop offset=".5" stop-color="#d4a017"/>
      <stop offset="1" stop-color="#B8860B"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#B8860B" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8860B" stop-opacity="0"/>
      <stop offset=".5" stop-color="#B8860B" stop-opacity=".18"/>
      <stop offset="1" stop-color="#B8860B" stop-opacity="0"/>
    </linearGradient>
    <style>
      .t { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .m { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .scan { animation: sweep 6s linear infinite; }
      @keyframes sweep { from { transform: translateX(-400px); } to { transform: translateX(1280px); } }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .scan, .blink { animation: none; } }
    </style>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect class="scan" x="0" y="0" width="400" height="400" fill="url(#scan)"/>

  <!-- moldura -->
  <rect x="24" y="24" width="1232" height="352" fill="none" stroke="#B8860B" stroke-opacity=".35"/>
  <path d="M24 64V24h40M1216 24h40v40M1256 336v40h-40M64 376H24v-40" fill="none" stroke="#B8860B" stroke-width="3"/>

  <!-- topo -->
  <text x="64" y="74" class="m" font-size="15" fill="#B8860B" letter-spacing="3">ENGENHARIA &amp; SEGURANÇA · BRASÍLIA · DF</text>

  <!-- marca -->
  <text x="60" y="210" class="t" font-size="132" font-weight="800" letter-spacing="6" fill="#f6f5f2">ZY<tspan fill="url(#gold)">F</tspan>R</text>
  <rect x="66" y="232" width="120" height="5" fill="url(#gold)"/>

  <text x="64" y="282" class="t" font-size="30" font-weight="600" fill="#f6f5f2">Encontramos a falha antes do atacante.</text>
  <text x="64" y="320" class="t" font-size="19" fill="#bdb6aa">Engenharia, segurança e inteligência artificial para quem não pode errar.</text>

  <!-- terminal -->
  <g transform="translate(840 96)">
    <rect width="372" height="212" rx="10" fill="#141414" stroke="#B8860B" stroke-opacity=".45"/>
    <circle cx="20" cy="20" r="5" fill="#e09381"/><circle cx="38" cy="20" r="5" fill="#B8860B"/><circle cx="56" cy="20" r="5" fill="#6f6a61"/>
    <text x="352" y="25" text-anchor="end" class="m" font-size="12" fill="#6f6a61">zyfr@brasilia</text>
    <g class="m" font-size="14">
      <text x="20" y="62" fill="#B8860B">$ <tspan fill="#f6f5f2">zyfr --frentes</tspan></text>
      <text x="20" y="88" fill="#bdb6aa">› segurança ofensiva · defensiva</text>
      <text x="20" y="110" fill="#bdb6aa">› software · IA · blockchain</text>
      <text x="20" y="132" fill="#bdb6aa">› perícia forense · setor público</text>
      <text x="20" y="154" fill="#bdb6aa">› IoT · drones · nuvem · educação</text>
      <text x="20" y="186" fill="#B8860B">$ <tspan fill="#f6f5f2">15 frentes, 1 engenharia</tspan><tspan class="blink" fill="#B8860B"> ▍</tspan></text>
    </g>
  </g>

  <text x="1212" y="356" text-anchor="end" class="m" font-size="13" fill="#6f6a61">zyfr.com.br</text>
</svg>
